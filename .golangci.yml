version: "2"

linters:
  enable:
    - gofmt
    - goimports
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused
    - gosec
    - misspell
    - revive
  settings:
    gosec:
      excludes:
        - G402  # TLS InsecureSkipVerify — documented dev-only option

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
