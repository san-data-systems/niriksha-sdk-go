name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    name: Auto-version & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment:
      name: release

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: "v"
          release_branches: main

      - name: Update version constant in source
        run: |
          NEW_VERSION="${{ steps.tag.outputs.new_version }}"
          # Update version constant if it exists in nirikshaai.go or version.go
          for f in nirikshaai.go version.go; do
            if [ -f "$f" ]; then
              sed -i "s/const Version = \".*\"/const Version = \"${NEW_VERSION}\"/" "$f"
            fi
          done

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.tag.outputs.new_version }} [skip ci]"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: "v${{ steps.tag.outputs.new_version }}"
          generate_release_notes: true
          body: ${{ steps.tag.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
