name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  release:
    name: GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract changelog for version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES=$(awk "/^## \[${VERSION#v}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pkg-index:
    name: Trigger pkg.go.dev index
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Request module indexing
        run: |
          curl -s "https://sum.golang.org/lookup/github.com/san-data-systems/niriksha-sdk-go@${GITHUB_REF_NAME}" || true
          curl -s "https://pkg.go.dev/github.com/san-data-systems/niriksha-sdk-go@${GITHUB_REF_NAME}" || true
